<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>ATM Placement</title>

    <script src="https://api-maps.yandex.ru/2.1/?lang=ru_RU"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        #map {
            width: 100%;
            height: 650px;
        }

        #result {
            padding: 20px;
            font-size: 18px;
            background: white;
        }

        .success {
            color: green;
            font-weight: bold;
        }

        .error {
            color: red;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div id="map"></div>

<div id="result">
    Кликните по карте для анализа точки
</div>

<script>

ymaps.ready(init);

function init() {

    const map = new ymaps.Map("map", {
        center: [55.7558, 37.6173],
        zoom: 11,
        controls: ['zoomControl']
    });

    let placemark = null;

    const resultDiv = document.getElementById("result");

    map.events.add('click', function (e) {

        const coords = e.get('coords');

        // ---------------------------------------------------
        // MARKER
        // ---------------------------------------------------

        if (placemark) {
            map.geoObjects.remove(placemark);
        }

        placemark = new ymaps.Placemark(
            coords,
            {},
            {
                preset: 'islands#redIcon'
            }
        );

        map.geoObjects.add(placemark);

        // ---------------------------------------------------
        // LOADING
        // ---------------------------------------------------

        resultDiv.innerHTML = "⏳ Анализируем точку...";

        // ---------------------------------------------------
        // SEND TO FLASK
        // ---------------------------------------------------

        fetch("/analyze", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                lat: coords[0],
                lng: coords[1]
            })
        })

        .then(response => response.json())

        .then(data => {

            console.log("Received response: %o", data);
            const lat = Number(data.lat).toFixed(6);
            const lng = Number(data.lng).toFixed(6);

            if (data.success) {

                resultDiv.innerHTML = `
                    <div class="success">
                        ✅ Можно установить банкомат
                    </div>

                    <br>

                    Причина:
                    ${data.reason}

                    <br><br>

                    📍 Координаты:
                    ${lat}, ${lng}
                `;

            } else {

                resultDiv.innerHTML = `
                    <div class="error">
                        ❌ Не рекомендуется
                    </div>

                    <br>

                    Причина:
                    ${data.reason}

                    <br><br>

                    📍 Координаты:
                    ${lat}, ${lng}
                `;
            }
        })

        .catch(error => {

            resultDiv.innerHTML = `
                <div class="error">
                    Ошибка запроса:
                    ${error}
                </div>
            `;
        });
    });
}

</script>

</body>

</html>
